name: Desktop tests

on:
  # The only Desktop type-check and test run; without pull_request a broken
  # Desktop change can only fail after it has already reached main.
  pull_request:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  computer-native:
    name: Verify macOS computer-use native helper
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # These scripts use only Node built-ins and the runner's Swift toolchain.
      # Keep native policy checks independent of workspace package installation.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test native input and window policies
        run: node packages/computer-use/scripts/test-native.mjs

      - name: Build universal native helper
        run: node apps/desktop/scripts/build-computer.mjs "$RUNNER_TEMP/eta-computer-ci"

      - name: Verify isolated native helper
        run: node scripts/verify-computer-native.mjs "$RUNNER_TEMP/eta-computer-ci/computer-native"

  test:
    name: Test Electron desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build agent package
        run: vp run --no-cache @eta/agent#build

      - name: Verify computer-use package
        run: |
          vp run --no-cache @eta/computer-use#build
          vp run @eta/computer-use#typecheck
          vp run @eta/computer-use#test

      - name: Verify shared Core
        run: |
          vp run --no-cache @eta/core#typecheck
          vp run @eta/core#test

      - name: Type-check repository scripts
        run: vp run --no-cache typecheck

      - name: Test release tooling
        run: vp test run scripts/desktop-release.test.ts

      - name: Type-check desktop
        run: vp run --no-cache @eta/desktop#typecheck

      - name: Run desktop tests
        run: vp run @eta/desktop#test
