name: Desktop tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Electron desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build agent package
        run: vp run --no-cache @eta/agent#build

      - name: Type-check repository scripts
        run: vp run --no-cache typecheck

      - name: Type-check desktop
        run: vp run --no-cache @eta/desktop#typecheck

      - name: Run desktop tests
        run: vp run @eta/desktop#test
