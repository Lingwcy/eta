name: Bot tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Core and Linux Bot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build agent
        run: vp run --no-cache @eta/agent#build
      - name: Verify Core
        run: |
          vp run --no-cache @eta/core#typecheck
          vp run @eta/core#test
          vp run --no-cache @eta/core#build
          vp run @eta/core#verify-package
      - name: Verify Bot
        run: |
          vp run --no-cache @eta/bot#build
          vp run @eta/bot#test
          vp run @eta/bot#verify-package
      - name: Verify Linux container and persistent volumes
        run: vp run @eta/bot#verify-container
