name: Deploy Bot to eta-server

on:
  workflow_run:
    workflows: [Desktop release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eta-server-bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify published release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' > /tmp/eta-release-tag
          test "$(cat /tmp/eta-release-tag)" = "$RELEASE_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build and verify Bot
        run: |
          vp run --no-cache @eta/bot#build
          vp run @eta/bot#test
          vp run @eta/bot#verify-package
      - name: Package distribution
        run: |
          tar -czf /tmp/eta-bot.tar.gz -C apps/bot dist scripts/eta-bot.service scripts/check-server.mjs
          (cd /tmp && sha256sum eta-bot.tar.gz > eta-bot.tar.gz.sha256)
      - name: Deploy and verify on eta-server
        env:
          SSH_KEY: ${{ secrets.ETA_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.ETA_SERVER_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.ETA_SERVER_HOST }}
          SSH_USER: ${{ vars.ETA_SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/eta-server
          chmod 600 ~/.ssh/eta-server
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/eta-server' EXIT
          ssh_options=(-i ~/.ssh/eta-server -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15)
          release_id="$(git rev-parse HEAD)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_dir=$(ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" 'mktemp -d /tmp/eta-bot-deploy.XXXXXXXX')
          [[ $remote_dir =~ ^/tmp/eta-bot-deploy\.[a-zA-Z0-9]+$ ]]
          trap 'rm -f ~/.ssh/eta-server; ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "rm -rf -- $remote_dir" || true' EXIT
          scp "${ssh_options[@]}" /tmp/eta-bot.tar.gz /tmp/eta-bot.tar.gz.sha256 apps/bot/scripts/deploy-server.sh "$SSH_USER@$SSH_HOST:$remote_dir/"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "cd $remote_dir && sha256sum -c eta-bot.tar.gz.sha256 && sudo -n bash deploy-server.sh eta-bot.tar.gz $release_id"
