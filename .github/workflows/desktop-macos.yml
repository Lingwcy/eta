name: macOS installer

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize using the repository's Apple secrets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Build macOS ${{ matrix.arch }} installer
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build installer
        run: vp run --no-cache @eta/desktop#package:mac --${{ matrix.arch }}
        env:
          ETA_SIGNED_RELEASE: ${{ inputs.signed && '1' || '0' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Eta-mac-${{ matrix.arch }}
          path: apps/desktop/dist/release/*.dmg
          if-no-files-found: error
