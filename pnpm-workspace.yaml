packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@effect/platform-node": 4.0.0-rc.117
  "@effect/platform-node-shared": 4.0.0-rc.117
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  "@types/node": ^24
  effect: 4.0.0-rc.117
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  yaml: ^2.9.1
  zustand: ^5.0.15
  "@types/react": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@base-ui/react": ^1.8.0
  electron-builder: ^26.15.3
  "@cf-wasm/photon": ^0.4.0
overrides:
  # The adapter's ^rc range also accepts incompatible stable releases.
  "@effect/platform-node-shared": "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  electron-winstaller: false
  "@google/genai": true
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.0.0 || 1.0.2"
  - "@earendil-works/pi-ai@1.0.0 || 1.0.2"
  - "@earendil-works/pi-telemetry@1.0.0 || 1.0.2"
