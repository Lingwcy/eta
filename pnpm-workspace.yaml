packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@effect/platform-node": 4.0.0-rc.117
  "@effect/platform-node-shared": 4.0.0-rc.117
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  "@types/node": ^24
  effect: 4.0.0-rc.117
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  yaml: ^2.9.1
  zustand: ^5.0.15
  "@types/react": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@base-ui/react": ^1.8.0
  electron-builder: ^26.17.0
  electron-updater: ^6.8.9
  "@cf-wasm/photon": ^0.4.0
  remark-gfm: ^4.0.1
  "@hono/node-server": ^2.1.4
  hono: ^4.13.13
  discord.js: ^14.27.0
  "@types/ws": ^8.18.2
  ws: ^8.22.0
  jsdom: ^30.1.2
  expo: ~57.0.29
  expo-crypto: ~57.0.4
  expo-router: ~57.0.27
  expo-splash-screen: ~57.0.10
overrides:
  # The adapter's ^rc range also accepts incompatible stable releases.
  "@effect/platform-node-shared": "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  electron-winstaller: false
  "@google/genai": true
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.0.0 || 1.0.2"
  - "@earendil-works/pi-ai@1.0.0 || 1.0.2"
  - "@earendil-works/pi-telemetry@1.0.0 || 1.0.2"
  - "@expo/cli@57.0.30"
  - "@expo/fingerprint@0.20.14"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/prebuild-config@57.0.19"
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo-modules-jsi@57.1.2
  - expo@57.0.29
  - "@expo/ui@57.0.24"
  - expo-crypto@57.0.4
  - expo-router@57.0.27
  - expo-splash-screen@57.0.10
  - "@expo/metro-runtime@57.0.17"
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
